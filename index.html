<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party 夾錢計算器</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .header-container { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; color: var(--primary); display: inline-block; }
    .version-badge { display: inline-block; background: #334155; color: var(--text-sub); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; vertical-align: middle; margin-left: 6px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background: var(--primary); color: #0f172a; font-weight: bold; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--primary-hover); }
    .btn-group { display: flex; gap: 6px; }
    button.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 4px 8px; font-size: 0.8rem; }
    button.btn-warning { background: transparent; color: var(--warning); border: 1px solid var(--warning); width: auto; padding: 4px 8px; font-size: 0.8rem; }
    button.btn-secondary { background: #475569; color: #fff; margin-top: 6px; }
    button.btn-accent { background: var(--accent); color: #000; margin-top: 10px; }
    .member-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { background: #334155; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; background: #0f172a; padding: 8px; border-radius: 6px; }
    .checkbox-group label { display: flex; align-items: center; gap: 6px; color: #fff; font-size: 0.9rem; margin: 0; cursor: pointer; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-color); }
    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-sub); }
    .total-banner { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
    .total-banner span { font-size: 1.1rem; color: var(--accent); font-weight: bold; }
    .settlement-box { background: #0f172a; border-left: 4px solid var(--accent); padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; margin-top: 10px; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>🎉 Party 夾錢計算器</h1>
    <span class="version-badge">v2.0.0</span>
  </div>

  <!-- 0. 歷史聚會存檔與切換 -->
  <div class="card" style="border-color: var(--primary);">
    <h2>📁 聚會存檔管理</h2>
    <div style="margin-bottom: 8px;">
      <label>切換歷史聚會</label>
      <select id="partySelector" onchange="switchParty(this.value)"></select>
    </div>
    <div class="flex-row">
      <button onclick="createNewParty()" style="background: var(--accent); color: #000;">➕ 建立新聚會</button>
      <button onclick="deleteCurrentParty()" class="btn-danger" style="width: 100%; padding: 10px;">🗑️ 刪除目前聚會</button>
    </div>
  </div>

  <!-- 1. Party 設定 -->
  <div class="card">
    <h2>1. 聚會與成員設定</h2>
    <label>Party 名稱</label>
    <input type="text" id="partyName" placeholder="例如：10/18 生日派對" oninput="updatePartyName()">
    
    <label>成員名單（以逗號隔開）</label>
    <input type="text" id="memberInput" placeholder="例如：Terry, Eddy, Anna, Sammy">
    <button onclick="updateMembers()">更新成員名單</button>
    <div class="member-tags" id="memberTags"></div>
  </div>

  <!-- 2. 消費項目 -->
  <div class="card">
    <h2 id="formTitle">2. 新增消費項目</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <label>項目名稱</label>
    <input type="text" id="itemName" placeholder="例如：PIZZA / 租場費">
    
    <label>總金額 (HKD)</label>
    <input type="number" id="itemCost" placeholder="0">
    
    <label>先墊付款項人 (Paid By)</label>
    <select id="itemPayer"></select>
    
    <label>分攤成員（預設全員）</label>
    <div class="checkbox-group" id="splitCheckboxes"></div>
    
    <button id="submitBtn" onclick="saveItem()">加入項目</button>
    <button id="cancelBtn" onclick="resetForm()" class="btn-secondary" style="display:none;">取消編輯</button>

    <div style="margin-top: 16px;">
      <h3>已記錄項目列表</h3>
      <div id="itemList"></div>
    </div>
  </div>

  <!-- 3. 預設收款資料 (選填) -->
  <div class="card">
    <h2>3. 預設收款資料 (選填)</h2>
    <label>轉數快 (FPS) / PayMe 追數備註</label>
    <input type="text" id="paymentInfo" placeholder="例如：Eddy FPS 91234567" oninput="updatePaymentInfo()">
  </div>

  <!-- 4. 結算明細 -->
  <div class="card">
    <h2>4. 結算明細與 WhatsApp 匯報</h2>
    
    <div class="total-banner">
      <span>💰 Party 總消費 (Total)：</span>
      <span id="partyTotalDisplay">$0</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>成員</th><th>應付</th><th>已墊付</th><th>淨額</th></tr>
        </thead>
        <tbody id="summaryTable"></tbody>
      </table>
    </div>

    <h3 style="margin-top: 16px;">💡 最簡化過數方案</h3>
    <div class="settlement-box" id="settlementPlan">點擊計算後顯示過數方案...</div>
    
    <button class="btn-accent" onclick="copyWhatsAppText()">📋 複製完整結算明細表 (WhatsApp)</button>
  </div>

  <script>
    // 多 Party 存檔結構
    let db = {
      currentId: null,
      parties: []
    };

    let currentParty = {
      id: '',
      partyName: '',
      members: [],
      items: [],
      paymentInfo: ''
    };

    window.onload = () => {
      loadDB();
      if (db.parties.length === 0) {
        // 如果完全沒有存檔，自動建立第一個預設聚會
        createNewParty(false);
      } else {
        // 預設載入第一個或上次選中的聚會
        currentParty = db.parties[0];
      }
      renderAll();
    };

    function loadDB() {
      const saved = localStorage.getItem('party_splitter_db');
      if (saved) {
        try {
          db = JSON.parse(saved);
        } catch(e) {
          console.error(e);
          db = { currentId: null, parties: [] };
        }
      }
    }

    function saveDB() {
      // 更新當前聚會到 db 陣列中
      const index = db.parties.findIndex(p => p.id === currentParty.id);
      if (index !== -1) {
        db.parties[index] = currentParty;
      } else {
        db.parties.push(currentParty);
      }
      db.currentId = currentParty.id;
      localStorage.setItem('party_splitter_db', JSON.stringify(db));
    }

    function createNewParty(showAlert = true) {
      const newId = 'party_' + Date.now();
      const newParty = {
        id: newId,
        partyName: '未命名聚會 (' + new Date().toLocaleDateString() + ')',
        members: [],
        items: [],
        paymentInfo: ''
      };
      db.parties.unshift(newParty); // 放到最前
      currentParty = newParty;
      saveDB();
      renderAll();
      if (showAlert) alert('已成功建立新聚會！');
    }

    function switchParty(partyId) {
      const found = db.parties.find(p => p.id === partyId);
      if (found) {
        currentParty = found;
        resetForm();
        renderAll();
      }
    }

    function deleteCurrentParty() {
      if (db.parties.length <= 1) {
        alert('最少需要保留一個聚會紀錄！');
        return;
      }
      if (confirm(`確定要刪除「${currentParty.partyName || '此聚會'}」嗎？`)) {
        db.parties = db.parties.filter(p => p.id !== currentParty.id);
        currentParty = db.parties[0];
        saveDB();
        renderAll();
      }
    }

    function updatePartyName() {
      currentParty.partyName = document.getElementById('partyName').value;
      saveDB();
      updateSelectorDropdown();
    }

    function updatePaymentInfo() {
      currentParty.paymentInfo = document.getElementById('paymentInfo').value;
      saveDB();
    }

    function updateSelectorDropdown() {
      const selector = document.getElementById('partySelector');
      selector.innerHTML = db.parties.map(p => `
        <option value="${p.id}" ${p.id === currentParty.id ? 'selected' : ''}>
          ${p.partyName || '未命名聚會'} (${p.items.length} 筆消費)
        </option>
      `).join('');
    }

    function updateMembers() {
      const input = document.getElementById('memberInput').value;
      const newNames = input.split(/[,，]/).map(n => n.trim()).filter(n => n !== '');
      
      if (newNames.length === 0) {
        alert('成員名單不能為空！');
        return;
      }

      let oldMembersMap = new Map(currentParty.members.map(m => [m.name, m.id]));
      let unassignedOldMembers = [...currentParty.members];
      let newMembers = [];

      newNames.forEach(name => {
        if (oldMembersMap.has(name)) {
          let id = oldMembersMap.get(name);
          newMembers.push({ id, name });
          unassignedOldMembers = unassignedOldMembers.filter(m => m.id !== id);
        } else {
          newMembers.push(null);
        }
      });

      newMembers.forEach((item, idx) => {
        if (item === null) {
          let name = newNames[idx];
          if (unassignedOldMembers.length > 0) {
            let oldMember = unassignedOldMembers.shift();
            newMembers[idx] = { id: oldMember.id, name: name };
          } else {
            newMembers[idx] = { id: 'm_new_' + Date.now() + '_' + idx, name: name };
          }
        }
      });

      const validIds = newMembers.map(m => m.id);
      currentParty.items = currentParty.items.map(item => {
        return {
          ...item,
          payerId: validIds.includes(item.payerId) ? item.payerId : newMembers[0].id,
          splitWith: item.splitWith.filter(id => validIds.includes(id))
        };
      });

      currentParty.members = newMembers;
      saveDB();
      renderAll();
    }

    function renderAll() {
      updateSelectorDropdown();
      document.getElementById('partyName').value = currentParty.partyName || '';
      document.getElementById('memberInput').value = currentParty.members.map(m => m.name).join(', ');
      document.getElementById('paymentInfo').value = currentParty.paymentInfo || '';

      document.getElementById('memberTags').innerHTML = currentParty.members.map(m => `<span class="tag">${m.name}</span>`).join('');
      
      const payerSelect = document.getElementById('itemPayer');
      payerSelect.innerHTML = currentParty.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      
      const checkboxes = document.getElementById('splitCheckboxes');
      checkboxes.innerHTML = currentParty.members.map(m => `
        <label><input type="checkbox" value="${m.id}" checked> ${m.name}</label>
      `).join('');

      renderItems();
      calculate();
    }

    function saveItem() {
      if (currentParty.members.length === 0) {
        alert('請先設定成員名單並點擊「更新成員名單」！');
        return;
      }

      const name = document.getElementById('itemName').value.trim();
      const cost = parseFloat(document.getElementById('itemCost').value);
      const payerId = document.getElementById('itemPayer').value;
      const checkedIds = Array.from(document.querySelectorAll('#splitCheckboxes input:checked')).map(cb => cb.value);
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!name || isNaN(cost) || cost <= 0 || checkedIds.length === 0) {
        alert('請填寫完整項目名稱、有效金額及至少一位分攤成員！');
        return;
      }

      if (editIndex === -1) {
        currentParty.items.push({ id: Date.now(), name, cost, payerId, splitWith: checkedIds });
      } else {
        currentParty.items[editIndex] = { ...currentParty.items[editIndex], name, cost, payerId, splitWith: checkedIds };
        resetForm();
      }

      document.getElementById('itemName').value = '';
      document.getElementById('itemCost').value = '';
      
      saveDB();
      renderAll();
    }

    function editItem(id) {
      const index = currentParty.items.findIndex(i => i.id === id);
      if (index === -1) return;
      const item = currentParty.items[index];

      document.getElementById('itemName').value = item.name;
      document.getElementById('itemCost').value = item.cost;
      document.getElementById('itemPayer').value = item.payerId;
      document.getElementById('editIndex').value = index;

      const checkboxes = document.querySelectorAll('#splitCheckboxes input');
      checkboxes.forEach(cb => {
        cb.checked = item.splitWith.includes(cb.value);
      });

      document.getElementById('formTitle').innerText = '2. 修改消費項目';
      document.getElementById('submitBtn').innerText = '儲存修改';
      document.getElementById('cancelBtn').style.display = 'block';
      
      window.scrollTo({ top: 350, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('itemName').value = '';
      document.getElementById('itemCost').value = '';
      document.getElementById('editIndex').value = '-1';
      document.getElementById('formTitle').innerText = '2. 新增消費項目';
      document.getElementById('submitBtn').innerText = '加入項目';
      document.getElementById('cancelBtn').style.display = 'none';

      const checkboxes = document.querySelectorAll('#splitCheckboxes input');
      checkboxes.forEach(cb => cb.checked = true);
    }

    function removeItem(id) {
      if (confirm('確定要刪除此項目嗎？')) {
        currentParty.items = currentParty.items.filter(i => i.id !== id);
        resetForm();
        saveDB();
        renderAll();
      }
    }

    function getMemberName(id) {
      const m = currentParty.members.find(member => member.id === id);
      return m ? m.name : '未知';
    }

    function renderItems() {
      const list = document.getElementById('itemList');
      if (currentParty.items.length === 0) {
        list.innerHTML = '<p style="color:var(--text-sub); font-size:0.85rem;">暫無項目</p>';
        return;
      }
      list.innerHTML = currentParty.items.map(item => {
        const payerName = getMemberName(item.payerId);
        const isAll = item.splitWith.length === currentParty.members.length;
        const splitNames = item.splitWith.map(id => getMemberName(id)).join(', ');
        const splitDesc = isAll ? '全體平分' : `${item.splitWith.length} 人 (${splitNames})`;
        
        return `
          <div class="item-row">
            <div>
              <strong>${item.name}</strong> - $${item.cost} 
              <br><small style="color:var(--text-sub)">${payerName} 付款 | 分攤: ${splitDesc}</small>
            </div>
            <div class="btn-group">
              <button class="btn-warning" onclick="editItem(${item.id})">修改</button>
              <button class="btn-danger" onclick="removeItem(${item.id})">刪除</button>
            </div>
          </div>
        `;
      }).join('');
    }

    let currentTotals = {};

    function calculate() {
      let totals = {};
      currentParty.members.forEach(m => totals[m.id] = { name: m.name, shouldPay: 0, paid: 0, net: 0 });

      let totalCost = 0;
      currentParty.items.forEach(item => {
        totalCost += item.cost;
        if (totals[item.payerId] !== undefined) {
          totals[item.payerId].paid += item.cost;
        }
        if (item.splitWith.length > 0) {
          const perPerson = item.cost / item.splitWith.length;
          item.splitWith.forEach(id => {
            if (totals[id] !== undefined) {
              totals[id].shouldPay += perPerson;
            }
          });
        }
      });

      currentTotals = totals;
      document.getElementById('partyTotalDisplay').innerText = `$${Math.round(totalCost)}`;

      let summaryHtml = '';
      let debtors = [];
      let creditors = [];

      if (currentParty.members.length === 0) {
        summaryHtml = '<tr><td colspan="4" style="text-align:center; color:var(--text-sub);">請先設定成員名單</td></tr>';
      } else {
        currentParty.members.forEach(m => {
          const t = totals[m.id] || { shouldPay: 0, paid: 0, net: 0 };
          const net = t.paid - t.shouldPay;
          t.net = net;
          summaryHtml += `
            <tr>
              <td><strong>${m.name}</strong></td>
              <td>$${Math.round(t.shouldPay)}</td>
              <td>$${Math.round(t.paid)}</td>
              <td style="color:${net >= 0 ? 'var(--accent)' : 'var(--danger)'}">
                ${net >= 0 ? '+' : ''}$${Math.round(net)}
              </td>
            </tr>
          `;

          if (net < -0.5) debtors.push({ name: m.name, amount: -net });
          if (net > 0.5) creditors.push({ name: m.name, amount: net });
        });
      }

      document.getElementById('summaryTable').innerHTML = summaryHtml;

      let transactions = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        let pay = Math.min(debtors[i].amount, creditors[j].amount);
        transactions.push(`${debtors[i].name} ➡️ ${creditors[j].name}: $${Math.round(pay)}`);
        
        debtors[i].amount -= pay;
        creditors[j].amount -= pay;

        if (debtors[i].amount < 0.5) i++;
        if (creditors[j].amount < 0.5) j++;
      }

      const planText = transactions.length > 0 ? transactions.join('\n') : (currentParty.members.length > 0 ? '🎉 全部結清，無需過數！' : '請先輸入成員');
      document.getElementById('settlementPlan').innerText = planText;
    }

    function copyWhatsAppText() {
      saveDB();
      const partyName = currentParty.partyName || 'Party';
      const plan = document.getElementById('settlementPlan').innerText;
      const payment = currentParty.paymentInfo;

      let totalCost = currentParty.items.reduce((sum, item) => sum + item.cost, 0);

      let text = `🎉 *${partyName} 結算報告*\n`;
      text += `💰 總消費 (Total)：$${Math.round(totalCost)}\n`;
      text += `----------------------\n`;
      text += `📊 *個人明細表：*\n`;
      
      currentParty.members.forEach(m => {
        const t = currentTotals[m.id] || { shouldPay: 0, paid: 0, net: 0 };
        const netStr = t.net >= 0 ? `+$${Math.round(t.net)}` : `-$${Math.round(-t.net)}`;
        text += `• *${m.name}* | 應付:$${Math.round(t.shouldPay)} | 已付:$${Math.round(t.paid)} | 淨額:${netStr}\n`;
      });

      text += `----------------------\n`;
      text += `👉 *建議過數方案：*\n${plan}\n`;
      
      if (payment) {
        text += `----------------------\n`;
        text += `💳 *收款資料：*\n${payment}\n`;
      }

      navigator.clipboard.writeText(text).then(() => {
        alert('已成功複製完整結算明細至剪貼簿！可以直接貼到 WhatsApp');
      });
    }
  </script>
</body>
</html>
