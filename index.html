<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party 夾錢計算器 | Party Splitter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .header-container { text-align: center; margin-bottom: 16px; position: relative; }
    h1 { font-size: 1.5rem; color: var(--primary); display: inline-block; }
    .version-badge { display: inline-block; background: #334155; color: var(--text-sub); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; vertical-align: middle; margin-left: 6px; }
    
    .lang-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: #334155;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
    }
    .lang-btn:hover { background: #475569; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; margin-bottom: 10px; }
    textarea { resize: vertical; height: 90px; font-family: monospace; font-size: 0.8rem; }
    button { width: 100%; padding: 10px; background: var(--primary); color: #0f172a; font-weight: bold; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--primary-hover); }
    .btn-group { display: flex; gap: 6px; }
    button.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 6px 12px; font-size: 0.8rem; }
    button.btn-warning { background: transparent; color: var(--warning); border: 1px solid var(--warning); width: auto; padding: 6px 12px; font-size: 0.8rem; }
    button.btn-secondary { background: #475569; color: #fff; margin-top: 6px; }
    button.btn-accent { background: var(--accent); color: #000; margin-top: 14px; }
    .member-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { background: #334155; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; background: #0f172a; padding: 8px; border-radius: 6px; }
    .checkbox-group label { display: flex; align-items: center; gap: 6px; color: #fff; font-size: 0.9rem; margin: 0; cursor: pointer; }
    
    .item-row { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      padding: 12px 0; 
      border-bottom: 1px dashed var(--border-color); 
    }
    .item-info { word-break: break-all; }
    .item-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-sub); }
    .total-banner { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
    .total-banner span { font-size: 1.1rem; color: var(--accent); font-weight: bold; }
    .settlement-box { background: #0f172a; border-left: 4px solid var(--accent); padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; margin-top: 10px; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    .json-panel { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px dashed var(--border-color); display: none; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 data-i18n="appTitle">🎉 Party 夾錢計算器</h1>
    <span class="version-badge">v3.0.0</span>
    <button class="lang-btn" onclick="toggleLanguage()">🌐 EN / 繁中</button>
  </div>

  <!-- 0. 歷史聚會存檔與 JSON 同步管理 -->
  <div class="card" style="border-color: var(--primary);">
    <h2 data-i18n="sec0Title">📁 聚會存檔與 JSON 協作</h2>
    <div style="margin-bottom: 8px;">
      <label data-i18n="labelSwitchParty">切換歷史聚會</label>
      <select id="partySelector" onchange="switchParty(this.value)"></select>
    </div>
    <div class="flex-row" style="margin-bottom: 8px;">
      <button data-i18n="btnNewParty" onclick="createNewParty()" style="background: var(--accent); color: #000;">➕ 建立新聚會</button>
      <button data-i18n="btnDelParty" onclick="deleteCurrentParty()" class="btn-danger" style="width: 100%; padding: 10px;">🗑️ 刪除目前聚會</button>
    </div>
    <div class="flex-row">
      <button data-i18n="btnExportParty" onclick="toggleJsonPanel('export')" class="btn-secondary" style="margin:0;">📤 匯出此聚會</button>
      <button data-i18n="btnExportAll" onclick="toggleJsonPanel('exportAll')" class="btn-secondary" style="margin:0; background: #0369a1;">📦 匯出全部</button>
      <button data-i18n="btnImportJson" onclick="toggleJsonPanel('import')" class="btn-secondary" style="margin:0; background: #15803d;">📥 匯入 JSON</button>
    </div>

    <!-- 匯出單一面板 -->
    <div id="exportPanel" class="json-panel">
      <label data-i18n="labelExportSingle">目前聚會的 JSON 字串：</label>
      <textarea id="exportTextarea" readonly></textarea>
      <button data-i18n="btnCopyJson" onclick="copyJsonText('exportTextarea')" style="background: var(--accent); color: #000; padding: 6px;">📋 複製單一聚會 JSON</button>
    </div>

    <!-- 匯出全部面板 -->
    <div id="exportAllPanel" class="json-panel">
      <label data-i18n="labelExportAll">全部歷史聚會資料庫 JSON (完整備份)：</label>
      <textarea id="exportAllTextarea" readonly></textarea>
      <button data-i18n="btnCopyJson" onclick="copyJsonText('exportAllTextarea')" style="background: var(--accent); color: #000; padding: 6px;">📋 複製全部資料庫 JSON</button>
    </div>

    <!-- 匯入面板 -->
    <div id="importPanel" class="json-panel">
      <label data-i18n="labelImport">請貼上朋友傳來的 JSON 字串：</label>
      <textarea id="importTextarea" data-i18n-ph="importPlaceholder" placeholder="在此貼上 JSON..."></textarea>
      <button data-i18n="btnConfirmImport" onclick="importPartyJson()" style="background: var(--primary); color: #0f172a; padding: 8px; margin-top: 6px;">✨ 確認匯入</button>
    </div>
  </div>

  <!-- 1. Party 設定 -->
  <div class="card">
    <h2 data-i18n="sec1Title">1. 聚會與成員設定</h2>
    <label data-i18n="labelPartyName">Party 名稱</label>
    <input type="text" id="partyName" data-i18n-ph="partyNamePlaceholder" placeholder="例如：10/18 生日派對" oninput="updatePartyName()">
    
    <label data-i18n="labelMembers">成員名單（以逗號隔開）</label>
    <input type="text" id="memberInput" data-i18n-ph="membersPlaceholder" placeholder="例如：Terry, Eddy, Anna, Sammy">
    <button data-i18n="btnUpdateMembers" onclick="updateMembers()">更新成員名單</button>
    <div class="member-tags" id="memberTags"></div>
  </div>

  <!-- 2. 消費項目 -->
  <div class="card">
    <h2 id="formTitle" data-i18n="sec2TitleAdd">2. 新增消費項目</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <label data-i18n="labelItemName">項目名稱</label>
    <input type="text" id="itemName" data-i18n-ph="itemNamePlaceholder" placeholder="例如：PIZZA / 租場費">
    
    <label data-i18n="labelItemCost">總金額 (HKD)</label>
    <input type="number" id="itemCost" placeholder="0">
    
    <label data-i18n="labelItemPayer">先墊付款項人 (Paid By)</label>
    <select id="itemPayer"></select>
    
    <label data-i18n="labelItemSplit">分攤成員（預設全員）</label>
    <div class="checkbox-group" id="splitCheckboxes"></div>
    
    <button id="submitBtn" data-i18n="btnAddItem" onclick="saveItem()">加入項目</button>
    <button id="cancelBtn" data-i18n="btnCancelEdit" onclick="resetForm()" class="btn-secondary" style="display:none;">取消編輯</button>

    <div style="margin-top: 16px;">
      <h3 data-i18n="itemListTitle">已記錄項目列表</h3>
      <div id="itemList"></div>
    </div>
  </div>

  <!-- 3. 結算明細、過數設定與 WhatsApp 匯報 -->
  <div class="card">
    <h2 data-i18n="sec3Title">3. 結算明細與 WhatsApp 匯報</h2>
    
    <div class="total-banner">
      <span data-i18n="totalCostText">💰 Party 總消費 (Total)：</span>
      <span id="partyTotalDisplay">$0</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th data-i18n="thMember">成員</th>
            <th data-i18n="thShouldPay">應付</th>
            <th data-i18n="thPaid">已墊付</th>
            <th data-i18n="thNet">淨額</th>
          </tr>
        </thead>
        <tbody id="summaryTable"></tbody>
      </table>
    </div>

    <!-- 過數模式切換區塊 -->
    <div style="margin-top: 16px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
      <label data-i18n="labelSettlementMode">⚙️ 選擇過數模式</label>
      <select id="settlementMode" onchange="updateSettlementMode(this.value)">
        <option value="minimal" data-i18n="optModeMinimal">⚡ 最簡過數 (自動互相抵銷)</option>
        <option value="collector" data-i18n="optModeCollector">🎯 指定大掌櫃 (全體統一轉給大掌櫃)</option>
      </select>

      <div id="collectorSelectBox" style="display:none; margin-top: 8px;">
        <label data-i18n="labelCollector">👤 指定大掌櫃 (接收款項者)</label>
        <select id="collectorMember" onchange="updateCollectorId(this.value)"></select>
      </div>
    </div>

    <h3 data-i18n="planTitle" style="margin-top: 16px;">💡 過數方案</h3>
    <div class="settlement-box" id="settlementPlan">點擊計算後顯示過數方案...</div>

    <div style="margin-top: 16px;">
      <label data-i18n="labelPaymentInfo">💳 收款資料 (選填，將會包含在 WhatsApp 訊息中)</label>
      <input type="text" id="paymentInfo" data-i18n-ph="paymentPlaceholder" placeholder="例如：Eddy FPS 91234567 / PayMe link" oninput="updatePaymentInfo()">
    </div>
    
    <button data-i18n="btnCopyWhatsApp" class="btn-accent" onclick="copyWhatsAppText()">📋 複製完整結算明細表 (WhatsApp)</button>
  </div>

  <script>

        // 動態渲染與彈窗訊息 (Dynamic Alerts & Text)

        confirmDbRestore: "📦 Full database backup detected!\n\nRestore all parties? (Note: Local data will be overwritten)",
        alertDbRestoreSuccess: "🎉 Database restored successfully!",
        confirmPartyOverwrite: "⚠️ Party already exists locally!\n\n[OK] ➡️ Overwrite\n[Cancel] ➡️ Save as copy (Append)",

        alertAppendSuccess: "🎉 Added as a new copy!",
        alertImportNewSuccess: "🎉 New party loaded successfully!",
        alertFormatError: "Parse failed: invalid JSON format!",
        alertMembersEmpty: "Member list cannot be empty!",
        alertFillItemError: "Please fill in item name, valid cost, and at least one member!",
        alertDeleteItemConfirm: "Are you sure to delete this item?",
        alertWhatsAppCopySuccess: "Summary report copied to clipboard!"
      }
    };

    let currentLang = localStorage.getItem('party_splitter_lang') || 'zh';

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('party_splitter_lang', currentLang);
      applyLanguage();
      renderAll();
    }

    // 自動語系綁定（利用 HTML data-i18n 與 data-i18n-ph 屬性）
    function applyLanguage() {
      const t = i18nConfig[currentLang];
      
      // 替換普通文字內容
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });

      // 替換 Placeholder 內容
      document.querySelectorAll('[data-i18n-ph]').forEach(el => {
        const key = el.getAttribute('data-i18n-ph');
        if (t[key]) el.placeholder = t[key];
      });

      // 動態更新編輯狀態下的 Form 標題與按鈕
      const editIndex = parseInt(document.getElementById('editIndex').value);
      document.getElementById('formTitle').innerText = editIndex === -1 ? t.sec2TitleAdd : t.sec2TitleEdit;
      document.getElementById('submitBtn').innerText = editIndex === -1 ? t.btnAddItem : t.btnSaveEdit;
    }

    let db = { currentId: null, parties: [] };
    let currentParty = { id: '', partyName: '', members: [], items: [], paymentInfo: '', settlementMode: 'minimal', collectorId: '' };

    window.onload = () => {
      loadDB();
      applyLanguage();
      if (db.parties.length === 0) {
        createNewParty(false);
      } else {
        currentParty = db.parties.find(p => p.id === db.currentId) || db.parties[0];
      }
      renderAll();
    };

    function loadDB() {
      const saved = localStorage.getItem('party_splitter_db');
      if (saved) {
        try { db = JSON.parse(saved); } 
        catch(e) { db = { currentId: null, parties: [] }; }
      }
    }

    function saveDB() {
      const index = db.parties.findIndex(p => p.id === currentParty.id);
      if (index !== -1) db.parties[index] = currentParty;
      else db.parties.unshift(currentParty);
      db.currentId = currentParty.id;
      localStorage.setItem('party_splitter_db', JSON.stringify(db));
    }

    function createNewParty(showAlert = true) {
      const t = i18nConfig[currentLang];
      const newParty = {
        id: 'party_' + Date.now(),
        partyName: `${t.defaultPartyName} (${new Date().toLocaleDateString()})`,
        members: [], items: [], paymentInfo: '', settlementMode: 'minimal', collectorId: ''
      };
      db.parties.unshift(newParty);
      currentParty = newParty;
      saveDB();
      renderAll();
      if (showAlert) alert(t.alertNewPartySuccess);
    }

    function switchParty(partyId) {
      const found = db.parties.find(p => p.id === partyId);
      if (found) {
        currentParty = found;
        db.currentId = currentParty.id;
        localStorage.setItem('party_splitter_db', JSON.stringify(db));
        resetForm();
        renderAll();
      }
    }

    function deleteCurrentParty() {
      const t = i18nConfig[currentLang];
      if (db.parties.length <= 1) {
        alert(t.alertAtLeastOneParty);
        return;
      }
      if (confirm(`${t.confirmDeleteParty} (${currentParty.partyName || ''})`)) {
        db.parties = db.parties.filter(p => p.id !== currentParty.id);
        currentParty = db.parties[0];
        saveDB();
        renderAll();
      }
    }

    function updatePartyName() {
      currentParty.partyName = document.getElementById('partyName').value;
      saveDB();
      updateSelectorDropdown();
    }

    function updatePaymentInfo() {
      currentParty.paymentInfo = document.getElementById('paymentInfo').value;
      saveDB();
    }

    function updateSettlementMode(mode) {
      currentParty.settlementMode = mode;
      document.getElementById('collectorSelectBox').style.display = mode === 'collector' ? 'block' : 'none';
      saveDB();
      calculate();
    }

    function updateCollectorId(id) {
      currentParty.collectorId = id;
      saveDB();
      calculate();
    }

    function updateSelectorDropdown() {
      const t = i18nConfig[currentLang];
      const selector = document.getElementById('partySelector');
      selector.innerHTML = db.parties.map(p => `
        <option value="${p.id}" ${p.id === currentParty.id ? 'selected' : ''}>
          ${p.partyName || t.defaultPartyName} (${p.items.length})
        </option>
      `).join('');
    }

    function toggleJsonPanel(type) {
      const exportPanel = document.getElementById('exportPanel');
      const exportAllPanel = document.getElementById('exportAllPanel');
      const importPanel = document.getElementById('importPanel');
      
      exportPanel.style.display = 'none';
      exportAllPanel.style.display = 'none';
      importPanel.style.display = 'none';

      if (type === 'export') {
        exportPanel.style.display = 'block';
        document.getElementById('exportTextarea').value = JSON.stringify(currentParty, null, 2);
      } else if (type === 'exportAll') {
        exportAllPanel.style.display = 'block';
        document.getElementById('exportAllTextarea').value = JSON.stringify(db, null, 2);
      } else if (type === 'import') {
        importPanel.style.display = 'block';
      }
    }

    function copyJsonText(elementId) {
      const t = i18nConfig[currentLang];
      const textarea = document.getElementById(elementId);
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => alert(t.alertCopySuccess));
    }

    function importPartyJson() {
      const raw = document.getElementById('importTextarea').value.trim();
      const t = i18nConfig[currentLang];

      if (!raw) {
        alert(t.alertEmptyImport);
        return;
      }

      try {
        const imported = JSON.parse(raw);

        if (imported.parties && Array.isArray(imported.parties)) {
          if (!confirm(t.confirmDbRestore)) return;
          db = imported;
          if (!db.parties.some(p => p.id === db.currentId)) {
            db.currentId = db.parties.length > 0 ? db.parties[0].id : null;
          }
          currentParty = db.parties.find(p => p.id === db.currentId) || db.parties[0];
          saveDB();
          renderAll();
          alert(t.alertDbRestoreSuccess);
        } else if (imported.id && Array.isArray(imported.members) && Array.isArray(imported.items)) {
          const existingIndex = db.parties.findIndex(p => p.id === imported.id);

          if (existingIndex !== -1) {
            const isOverwrite = confirm(t.confirmPartyOverwrite);
            if (isOverwrite) {
              db.parties[existingIndex] = imported;
              currentParty = imported;
              alert(t.alertOverwriteSuccess);
            } else {
              let newPartyCopy = { ...imported, id: 'party_' + Date.now(), partyName: (imported.partyName || 'Imported') + ' (Copy)' };
              db.parties.unshift(newPartyCopy);
              currentParty = newPartyCopy;
              alert(t.alertAppendSuccess);
            }
          } else {
            db.parties.unshift(imported);
            currentParty = imported;
            alert(t.alertImportNewSuccess);
          }
          saveDB();
          renderAll();
        } else {
          alert(t.alertFormatError);
          return;
        }

        document.getElementById('importPanel').style.display = 'none';
        document.getElementById('importTextarea').value = '';
      } catch(e) {
        alert(t.alertFormatError);
      }
    }

    function updateMembers() {
      const t = i18nConfig[currentLang];
      const input = document.getElementById('memberInput').value;
      const newNames = input.split(/[,，]/).map(n => n.trim()).filter(n => n !== '');
      
      if (newNames.length === 0) {
        alert(t.alertMembersEmpty);
        return;
      }

      let oldMembersMap = new Map(currentParty.members.map(m => [m.name, m.id]));
      let unassignedOldMembers = [...currentParty.members];
      let newMembers = [];

      newNames.forEach(name => {
        if (oldMembersMap.has(name)) {
          let id = oldMembersMap.get(name);
          newMembers.push({ id, name });
          unassignedOldMembers = unassignedOldMembers.filter(m => m.id !== id);
        } else {
          newMembers.push(null);
        }
      });

      newMembers.forEach((item, idx) => {
        if (item === null) {
          let name = newNames[idx];
          if (unassignedOldMembers.length > 0) {
            let oldMember = unassignedOldMembers.shift();
            newMembers[idx] = { id: oldMember.id, name: name };
          } else {
            newMembers[idx] = { id: 'm_new_' + Date.now() + '_' + idx, name: name };
          }
        }
      });

      const validIds = newMembers.map(m => m.id);
      currentParty.items = currentParty.items.map(item => ({
        ...item,
        payerId: validIds.includes(item.payerId) ? item.payerId : newMembers[0].id,
        splitWith: item.splitWith.filter(id => validIds.includes(id))
      }));

      currentParty.members = newMembers;
      if (!validIds.includes(currentParty.collectorId) && newMembers.length > 0) {
        currentParty.collectorId = newMembers[0].id;
      }

      saveDB();
      renderAll();
    }

    function renderAll() {
      applyLanguage();
      updateSelectorDropdown();
      document.getElementById('partyName').value = currentParty.partyName || '';
      document.getElementById('memberInput').value = currentParty.members.map(m => m.name).join(', ');
      document.getElementById('paymentInfo').value = currentParty.paymentInfo || '';

      document.getElementById('memberTags').innerHTML = currentParty.members.map(m => `<span class="tag">${m.name}</span>`).join('');
      
      const payerSelect = document.getElementById('itemPayer');
      payerSelect.innerHTML = currentParty.members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      
      const checkboxes = document.getElementById('splitCheckboxes');
      checkboxes.innerHTML = currentParty.members.map(m => `
        <label><input type="checkbox" value="${m.id}" checked> ${m.name}</label>
      `).join('');

      const mode = currentParty.settlementMode || 'minimal';
      document.getElementById('settlementMode').value = mode;
      document.getElementById('collectorSelectBox').style.display = mode === 'collector' ? 'block' : 'none';

      const collectorSelect = document.getElementById('collectorMember');
      collectorSelect.innerHTML = currentParty.members.map(m => `
        <option value="${m.id}" ${m.id === currentParty.collectorId ? 'selected' : ''}>${m.name}</option>
      `).join('');

      renderItems();
      calculate();
    }

    function saveItem() {
      const t = i18nConfig[currentLang];
      if (currentParty.members.length === 0) {
        alert(t.alertMembersEmpty);
        return;
      }

      const name = document.getElementById('itemName').value.trim();
      const cost = parseFloat(document.getElementById('itemCost').value);
      const payerId = document.getElementById('itemPayer').value;
      const checkedIds = Array.from(document.querySelectorAll('#splitCheckboxes input:checked')).map(cb => cb.value);
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!name || isNaN(cost) || cost <= 0 || checkedIds.length === 0) {
        alert(t.alertFillItemError);
        return;
      }

      if (editIndex === -1) {
        currentParty.items.push({ id: Date.now(), name, cost, payerId, splitWith: checkedIds });
      } else {
        currentParty.items[editIndex] = { ...currentParty.items[editIndex], name, cost, payerId, splitWith: checkedIds };
        resetForm();
      }

      document.getElementById('itemName').value = '';
      document.getElementById('itemCost').value = '';
      saveDB();
      renderAll();
    }

    function editItem(id) {
      const index = currentParty.items.findIndex(i => i.id === id);
      if (index === -1) return;
      const item = currentParty.items[index];

      document.getElementById('itemName').value = item.name;
      document.getElementById('itemCost').value = item.cost;
      document.getElementById('itemPayer').value = item.payerId;
      document.getElementById('editIndex').value = index;

      const checkboxes = document.querySelectorAll('#splitCheckboxes input');
      checkboxes.forEach(cb => {
        cb.checked = item.splitWith.includes(cb.value);
      });

      applyLanguage();
      document.getElementById('cancelBtn').style.display = 'block';
      window.scrollTo({ top: 350, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('itemName').value = '';
      document.getElementById('itemCost').value = '';
      document.getElementById('editIndex').value = '-1';
      document.getElementById('cancelBtn').style.display = 'none';
      applyLanguage();

      const checkboxes = document.querySelectorAll('#splitCheckboxes input');
      checkboxes.forEach(cb => cb.checked = true);
    }

    function removeItem(id) {
      const t = i18nConfig[currentLang];
      if (confirm(t.alertDeleteItemConfirm)) {
        currentParty.items = currentParty.items.filter(i => i.id !== id);
        resetForm();
        saveDB();
        renderAll();
      }
    }

    function getMemberName(id) {
      const t = i18nConfig[currentLang];
      const m = currentParty.members.find(member => member.id === id);
      return m ? m.name : t.unknownMember;
    }

    function renderItems() {
      const list = document.getElementById('itemList');
      const t = i18nConfig[currentLang];
      if (currentParty.items.length === 0) {
        list.innerHTML = `<p style="color:var(--text-sub); font-size:0.85rem;">${t.noItemsText}</p>`;
        return;
      }
      list.innerHTML = currentParty.items.map(item => {
        const payerName = getMemberName(item.payerId);
        const isAll = item.splitWith.length === currentParty.members.length;
        const splitNames = item.splitWith.map(id => getMemberName(id)).join(', ');
        const splitDesc = isAll ? t.allSplitText : `${item.splitWith.length} ${t.peopleSuffix} (${splitNames})`;
        
        return `
          <div class="item-row">
            <div class="item-info">
              <strong>${item.name}</strong> - $${item.cost} 
              <br><small style="color:var(--text-sub)">${payerName} Paid | Split: ${splitDesc}</small>
            </div>
            <div class="item-actions">
              <button class="btn-warning" onclick="editItem(${item.id})">${t.editBtnText}</button>
              <button class="btn-danger" onclick="removeItem(${item.id})">${t.deleteBtnText}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    let currentTotals = {};

    function calculate() {
      const t = i18nConfig[currentLang];
      let totals = {};
      currentParty.members.forEach(m => totals[m.id] = { id: m.id, name: m.name, shouldPay: 0, paid: 0, net: 0 });

      let totalCost = 0;
      currentParty.items.forEach(item => {
        totalCost += item.cost;
        if (totals[item.payerId] !== undefined) totals[item.payerId].paid += item.cost;
        if (item.splitWith.length > 0) {
          const perPerson = item.cost / item.splitWith.length;
          item.splitWith.forEach(id => {
            if (totals[id] !== undefined) totals[id].shouldPay += perPerson;
          });
        }
      });

      currentTotals = totals;
      document.getElementById('partyTotalDisplay').innerText = `$${Math.round(totalCost)}`;

      if (!currentParty.collectorId || !currentParty.members.some(m => m.id === currentParty.collectorId)) {
        let maxPaid = -1;
        let topPayerId = currentParty.members.length > 0 ? currentParty.members[0].id : '';
        Object.values(totals).forEach(t => {
          if (t.paid > maxPaid) {
            maxPaid = t.paid;
            topPayerId = t.id;
          }
        });
        currentParty.collectorId = topPayerId;
        const colSelect = document.getElementById('collectorMember');
        if (colSelect) colSelect.value = topPayerId;
      }

      let summaryHtml = '';
      if (currentParty.members.length === 0) {
        summaryHtml = `<tr><td colspan="4" style="text-align:center; color:var(--text-sub);">${t.needMembers}</td></tr>`;
      } else {
        currentParty.members.forEach(m => {
          const tot = totals[m.id] || { shouldPay: 0, paid: 0, net: 0 };
          const net = tot.paid - tot.shouldPay;
          tot.net = net;
          summaryHtml += `
            <tr>
              <td><strong>${m.name}</strong></td>
              <td>$${Math.round(tot.shouldPay)}</td>
              <td>$${Math.round(tot.paid)}</td>
              <td style="color:${net >= 0 ? 'var(--accent)' : 'var(--danger)'}">
                ${net >= 0 ? '+' : ''}$${Math.round(net)}
              </td>
            </tr>
          `;
        });
      }

      document.getElementById('summaryTable').innerHTML = summaryHtml;

      let transactions = [];
      const mode = currentParty.settlementMode || 'minimal';

      if (mode === 'minimal') {
        let debtors = [];
        let creditors = [];
        currentParty.members.forEach(m => {
          const net = totals[m.id].net;
          if (net < -0.5) debtors.push({ name: m.name, amount: -net });
          if (net > 0.5) creditors.push({ name: m.name, amount: net });
        });

        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          let pay = Math.min(debtors[i].amount, creditors[j].amount);
          transactions.push(`${debtors[i].name} ➡️ ${creditors[j].name}: $${Math.round(pay)}`);
          debtors[i].amount -= pay;
          creditors[j].amount -= pay;
          if (debtors[i].amount < 0.5) i++;
          if (creditors[j].amount < 0.5) j++;
        }
      } else {
        const collectorName = getMemberName(currentParty.collectorId);
        const colSuffix = t.collectorSuffix;
        
        currentParty.members.forEach(m => {
          if (m.id !== currentParty.collectorId) {
            const net = totals[m.id].net;
            if (net < -0.5) transactions.push(`${m.name} ➡️ ${collectorName}${colSuffix}: $${Math.round(-net)}`);
          }
        });

        currentParty.members.forEach(m => {
          if (m.id !== currentParty.collectorId) {
            const net = totals[m.id].net;
            if (net > 0.5) transactions.push(`${collectorName}${colSuffix} ➡️ ${m.name}: $${Math.round(net)}`);
          }
        });
      }

      const planText = transactions.length > 0 ? transactions.join('\n') : (currentParty.members.length > 0 ? t.allSettled : t.needMembers);
      document.getElementById('settlementPlan').innerText = planText;
    }

    function copyWhatsAppText() {
      saveDB();
      const t = i18nConfig[currentLang];
      const partyName = currentParty.partyName || t.defaultPartyName;
      const plan = document.getElementById('settlementPlan').innerText;
      const payment = currentParty.paymentInfo;
      const mode = currentParty.settlementMode || 'minimal';
      const collectorName = getMemberName(currentParty.collectorId);

      let totalCost = currentParty.items.reduce((sum, item) => sum + item.cost, 0);

      let text = currentLang === 'zh' ? 
        `🎉 *${partyName} 結算報告*\n💰 總消費 (Total)：$${Math.round(totalCost)}\n----------------------\n📊 *個人明細表：*\n` :
        `🎉 *${partyName} Settlement Report*\n💰 Total Cost: $${Math.round(totalCost)}\n----------------------\n📊 *Individual Summary:*\n`;
      
      currentParty.members.forEach(m => {
        const tot = currentTotals[m.id] || { shouldPay: 0, paid: 0, net: 0 };
        const netStr = tot.net >= 0 ? `+$${Math.round(tot.net)}` : `-$${Math.round(-tot.net)}`;
        text += currentLang === 'zh' ? 
          `• *${m.name}* | 應付:$${Math.round(tot.shouldPay)} | 已付:$${Math.round(tot.paid)} | 淨額:${netStr}\n` :
          `• *${m.name}* | Pay:$${Math.round(tot.shouldPay)} | Paid:$${Math.round(tot.paid)} | Net:${netStr}\n`;
      });

      text += `----------------------\n`;
      if (currentLang === 'zh') {
        text += mode === 'collector' ? 
          `👉 *建議過數方案 (大掌櫃模式: ${collectorName})：*\n${plan}\n` : 
          `👉 *建議過數方案 (最簡過數)：*\n${plan}\n`;
      } else {
        text += mode === 'collector' ? 
          `👉 *Transfer Plan (Collector: ${collectorName}):*\n${plan}\n` : 
          `👉 *Transfer Plan (Minimal):*\n${plan}\n`;
      }
      
      if (payment) {
        text += `----------------------\n`;
        text += currentLang === 'zh' ? `💳 *收款資料：*\n${payment}\n` : `💳 *Payment Info:*\n${payment}\n`;
      }

      navigator.clipboard.writeText(text).then(() => alert(t.alertWhatsAppCopySuccess));
    }
  </script>
</body>
</html>
