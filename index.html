<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party 夾錢計算器 | Party Splitter</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5; }
    .header-container { text-align: center; margin-bottom: 16px; position: relative; }
    h1 { font-size: 1.5rem; color: var(--primary); display: inline-block; }
    .version-badge { display: inline-block; background: #334155; color: var(--text-sub); font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; vertical-align: middle; margin-left: 6px; }
    
    .lang-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: #334155;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: auto;
    }
    .lang-btn:hover { background: #475569; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 0.95rem; margin-bottom: 10px; }
    textarea { resize: vertical; height: 90px; font-family: monospace; font-size: 0.8rem; }
    button { width: 100%; padding: 10px; background: var(--primary); color: #0f172a; font-weight: bold; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--primary-hover); }
    .btn-group { display: flex; gap: 6px; }
    button.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 6px 12px; font-size: 0.8rem; }
    button.btn-warning { background: transparent; color: var(--warning); border: 1px solid var(--warning); width: auto; padding: 6px 12px; font-size: 0.8rem; }
    button.btn-secondary { background: #475569; color: #fff; margin-top: 6px; }
    button.btn-accent { background: var(--accent); color: #000; margin-top: 14px; }
    button.btn-info { background: transparent; color: var(--primary); border: 1px solid var(--primary); width: auto; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; white-space: nowrap; }
    
    .member-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { background: #334155; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; }
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; background: #0f172a; padding: 8px; border-radius: 6px; }
    .checkbox-group label { display: flex; align-items: center; gap: 6px; color: #fff; font-size: 0.9rem; margin: 0; cursor: pointer; }
    
    .item-row { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      padding: 12px 0; 
      border-bottom: 1px dashed var(--border-color); 
    }
    .item-info { word-break: break-all; }
    .item-actions { display: flex; justify-content: flex-end; gap: 8px; }

    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    th { color: var(--text-sub); }
    .text-right { text-align: right; }
    .total-banner { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
    .total-banner span { font-size: 1.1rem; color: var(--accent); font-weight: bold; }
    .settlement-box { background: #0f172a; border-left: 4px solid var(--accent); padding: 10px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; margin-top: 10px; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    .json-panel { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px dashed var(--border-color); display: none; }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 data-i18n="appTitle">🎉 Party 夾錢計算器</h1>
    <span class="version-badge">v3.2.0</span>
    <button class="lang-btn" onclick="toggleLanguage()">🌐 EN / 繁中</button>
  </div>

  <!-- 0. 歷史聚會存檔與 JSON 同步管理 -->
  <div class="card" style="border-color: var(--primary);">
    <h2 data-i18n="sec0Title">📁 聚會存檔與 JSON 協作</h2>
    <div style="margin-bottom: 8px;">
      <label data-i18n="labelSwitchParty">切換歷史聚會</label>
      <select id="partySelector" onchange="switchParty(this.value)"></select>
    </div>
    <div class="flex-row" style="margin-bottom: 8px;">
      <button data-i18n="btnNewParty" onclick="createNewParty()" style="background: var(--accent); color: #000;">➕ 建立新聚會</button>
      <button data-i18n="btnDelParty" onclick="deleteCurrentParty()" class="btn-danger" style="width: 100%; padding: 10px;">🗑️ 刪除目前聚會</button>
    </div>
    <div class="flex-row">
      <button data-i18n="btnExportParty" onclick="toggleJsonPanel('export')" class="btn-secondary" style="margin:0;">📤 匯出此聚會</button>
      <button data-i18n="btnExportAll" onclick="toggleJsonPanel('exportAll')" class="btn-secondary" style="margin:0; background: #0369a1;">📦 匯出全部</button>
      <button data-i18n="btnImportJson" onclick="toggleJsonPanel('import')" class="btn-secondary" style="margin:0; background: #15803d;">📥 匯入 JSON</button>
    </div>

    <!-- 匯出單一面板 -->
    <div id="exportPanel" class="json-panel">
      <label data-i18n="labelExportSingle">目前聚會的 JSON 字串：</label>
      <textarea id="exportTextarea" readonly></textarea>
      <button data-i18n="btnCopyJson" onclick="copyJsonText('exportTextarea')" style="background: var(--accent); color: #000; padding: 6px;">📋 複製單一聚會 JSON</button>
    </div>

    <!-- 匯出全部面板 -->
    <div id="exportAllPanel" class="json-panel">
      <label data-i18n="labelExportAll">全部歷史聚會資料庫 JSON (完整備份)：</label>
      <textarea id="exportAllTextarea" readonly></textarea>
      <button data-i18n="btnCopyJson" onclick="copyJsonText('exportAllTextarea')" style="background: var(--accent); color: #000; padding: 6px;">📋 複製全部資料庫 JSON</button>
    </div>

    <!-- 匯入面板 -->
    <div id="importPanel" class="json-panel">
      <label data-i18n="labelImport">請貼上朋友傳來的 JSON 字串：</label>
      <textarea id="importTextarea" data-i18n-ph="importPlaceholder" placeholder="在此貼上 JSON..."></textarea>
      <button data-i18n="btnConfirmImport" onclick="importPartyJson()" style="background: var(--primary); color: #0f172a; padding: 8px; margin-top: 6px;">✨ 確認匯入</button>
    </div>
  </div>

  <!-- 1. Party 設定 -->
  <div class="card">
    <h2 data-i18n="sec1Title">1. 聚會與成員設定</h2>
    <label data-i18n="labelPartyName">Party 名稱</label>
    <input type="text" id="partyName" data-i18n-ph="partyNamePlaceholder" placeholder="例如：10/18 生日派對" oninput="updatePartyName()">
    
    <label data-i18n="labelMembers">成員名單（以逗號隔開）</label>
    <input type="text" id="memberInput" data-i18n-ph="membersPlaceholder" placeholder="例如：Terry, Eddy, Anna, Sammy">
    <button data-i18n="btnUpdateMembers" onclick="updateMembers()">更新成員名單</button>
    <div class="member-tags" id="memberTags"></div>
  </div>

  <!-- 2. 消費項目 -->
  <div class="card">
    <h2 id="formTitle" data-i18n="sec2TitleAdd">2. 新增消費項目</h2>
    <input type="hidden" id="editIndex" value="-1">
    
    <label data-i18n="labelItemName">項目名稱</label>
    <input type="text" id="itemName" data-i18n-ph="itemNamePlaceholder" placeholder="例如：PIZZA / 租場費">
    
    <label data-i18n="labelItemCost">總金額 (HKD)</label>
    <input type="number" id="itemCost" placeholder="0">
    
    <label data-i18n="labelItemPayer">先墊付款項人 (Paid By)</label>
    <select id="itemPayer"></select>
    
    <label data-i18n="labelItemSplit">分攤成員（預設全員）</label>
    <div class="checkbox-group" id="splitCheckboxes"></div>
    
    <button id="submitBtn" data-i18n="btnAddItem" onclick="saveItem()">加入項目</button>
    <button id="cancelBtn" data-i18n="btnCancelEdit" onclick="resetForm()" class="btn-secondary" style="display:none;">取消編輯</button>

    <div style="margin-top: 16px;">
      <h3 data-i18n="itemListTitle">已記錄項目列表</h3>
      <div id="itemList"></div>
    </div>
  </div>

  <!-- 3. 結算明細、過數設定與 WhatsApp 匯報 -->
  <div class="card">
    <h2 data-i18n="sec3Title">3. 結算明細與 WhatsApp 匯報</h2>
    
    <div class="total-banner">
      <span data-i18n="totalCostText">💰 Party 總消費 (Total)：</span>
      <span id="partyTotalDisplay">$0</span>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th data-i18n="thMember">成員</th>
            <th data-i18n="thShouldPay">應付</th>
            <th data-i18n="thPaid">已墊付</th>
            <th data-i18n="thNet">淨額</th>
            <th class="text-right" data-i18n="thAction">明細</th>
          </tr>
        </thead>
        <tbody id="summaryTable"></tbody>
      </table>
    </div>

    <!-- 過數模式切換區塊 -->
    <div style="margin-top: 16px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
      <label data-i18n="labelSettlementMode">⚙️ 選擇過數模式</label>
      <select id="settlementMode" onchange="updateSettlementMode(this.value)">
        <option value="minimal" data-i18n="optModeMinimal">⚡ 最簡過數 (自動互相抵銷)</option>
        <option value="collector" data-i18n="optModeCollector">🎯 指定大掌櫃 (全體統一轉給大掌櫃)</option>
      </select>

      <div id="collectorSelectBox" style="display:none; margin-top: 8px;">
        <label data-i18n="labelCollector">👤 指定大掌櫃 (接收款項者)</label>
        <select id="collectorMember" onchange="updateCollectorId(this.value)"></select>
      </div>
    </div>

    <h3 data-i18n="planTitle" style="margin-top: 16px;">💡 過數方案</h3>
    <div class="settlement-box" id="settlementPlan">點擊計算後顯示過數方案...</div>

    <div style="margin-top: 16px;">
      <label data-i18n="labelPaymentInfo">💳 收款資料 (選填，將會包含在 WhatsApp 訊息中)</label>
      <input type="text" id="paymentInfo" data-i18n-ph="paymentPlaceholder" placeholder="例如：Eddy FPS 91234567 / PayMe link" oninput="updatePaymentInfo()">
    </div>
    
    <button data-i18n="btnCopyWhatsApp" class="btn-accent" onclick="copyWhatsAppText()">📋 複製完整結算明細表 (WhatsApp)</button>
  </div>

  <script>
    /* ==========================================================================
